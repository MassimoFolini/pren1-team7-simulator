name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit-Tests
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Alle Szenarien
        run: python -X utf8 -m pren_sim run --all
        env:
          PYTHONPATH: src
